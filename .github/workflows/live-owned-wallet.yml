name: Live owned-wallet signer test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-secrets-check:
    name: Verify live-signer secrets present
    runs-on: ubuntu-latest
    environment: live-signer
    steps:
      - name: Fail if required secrets are empty
        env:
          MANDATE_PRIVY_APP_ID: ${{ secrets.MANDATE_PRIVY_APP_ID }}
          MANDATE_PRIVY_APP_SECRET: ${{ secrets.MANDATE_PRIVY_APP_SECRET }}
          MANDATE_PRIVY_API_BASE: ${{ secrets.MANDATE_PRIVY_API_BASE }}
          MANDATE_PRIVY_AUTHORIZATION_KEY: ${{ secrets.MANDATE_PRIVY_AUTHORIZATION_KEY }}
          MANDATE_PRIVY_SIGNER_ID: ${{ secrets.MANDATE_PRIVY_SIGNER_ID }}
          MANDATE_SIGNER_URL: ${{ secrets.MANDATE_SIGNER_URL }}
          E2E_SIGNER_TEST_PRIVY_WALLET_ID: ${{ secrets.E2E_SIGNER_TEST_PRIVY_WALLET_ID }}
          E2E_SIGNER_TEST_WALLET_ADDRESS: ${{ secrets.E2E_SIGNER_TEST_WALLET_ADDRESS }}
          E2E_MODE_C_USER_PRIVY_WALLET_ID: ${{ secrets.E2E_MODE_C_USER_PRIVY_WALLET_ID }}
          E2E_MODE_C_USER_WALLET_ADDRESS: ${{ secrets.E2E_MODE_C_USER_WALLET_ADDRESS }}
          E2E_MODE_C_PRIVY_OWNER_AUTH_KEY: ${{ secrets.E2E_MODE_C_PRIVY_OWNER_AUTH_KEY }}
          E2E_MODE_C_PRIVY_POLICY_ID: ${{ secrets.E2E_MODE_C_PRIVY_POLICY_ID }}
          E2E_CANOPY_API_URL: ${{ secrets.E2E_CANOPY_API_URL }}
          E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN: ${{ secrets.E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN }}
          E2E_CANOPY_OPS_ADMIN_TOKEN: ${{ secrets.E2E_CANOPY_OPS_ADMIN_TOKEN }}
          E2E_CANOPY_UNIVOCITY_ADDR: ${{ secrets.E2E_CANOPY_UNIVOCITY_ADDR }}
          E2E_CANOPY_CHAIN_ID: ${{ secrets.E2E_CANOPY_CHAIN_ID }}
          E2E_DELEGATION_COORDINATOR_URL: ${{ secrets.E2E_DELEGATION_COORDINATOR_URL }}
          E2E_MANDATE_AGENT_WEBHOOK_URL: ${{ secrets.E2E_MANDATE_AGENT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          missing=0
          check() {
            if [ -z "${1:-}" ]; then
              echo "missing required secret: $2" >&2
              missing=1
            fi
          }
          check "$MANDATE_PRIVY_APP_ID" MANDATE_PRIVY_APP_ID
          check "$MANDATE_PRIVY_APP_SECRET" MANDATE_PRIVY_APP_SECRET
          check "$MANDATE_PRIVY_API_BASE" MANDATE_PRIVY_API_BASE
          check "$MANDATE_PRIVY_AUTHORIZATION_KEY" MANDATE_PRIVY_AUTHORIZATION_KEY
          check "$MANDATE_PRIVY_SIGNER_ID" MANDATE_PRIVY_SIGNER_ID
          check "$MANDATE_SIGNER_URL" MANDATE_SIGNER_URL
          check "$E2E_SIGNER_TEST_PRIVY_WALLET_ID" E2E_SIGNER_TEST_PRIVY_WALLET_ID
          check "$E2E_SIGNER_TEST_WALLET_ADDRESS" E2E_SIGNER_TEST_WALLET_ADDRESS
          check "$E2E_MODE_C_USER_PRIVY_WALLET_ID" E2E_MODE_C_USER_PRIVY_WALLET_ID
          check "$E2E_MODE_C_USER_WALLET_ADDRESS" E2E_MODE_C_USER_WALLET_ADDRESS
          check "$E2E_MODE_C_PRIVY_OWNER_AUTH_KEY" E2E_MODE_C_PRIVY_OWNER_AUTH_KEY
          check "$E2E_MODE_C_PRIVY_POLICY_ID" E2E_MODE_C_PRIVY_POLICY_ID
          check "$E2E_CANOPY_API_URL" E2E_CANOPY_API_URL
          check "$E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN" E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN
          check "$E2E_CANOPY_OPS_ADMIN_TOKEN" E2E_CANOPY_OPS_ADMIN_TOKEN
          check "$E2E_CANOPY_UNIVOCITY_ADDR" E2E_CANOPY_UNIVOCITY_ADDR
          check "$E2E_CANOPY_CHAIN_ID" E2E_CANOPY_CHAIN_ID
          check "$E2E_DELEGATION_COORDINATOR_URL" E2E_DELEGATION_COORDINATOR_URL
          check "$E2E_MANDATE_AGENT_WEBHOOK_URL" E2E_MANDATE_AGENT_WEBHOOK_URL
          if [ "$missing" -ne 0 ]; then
            echo "Sync Doppler mandate-forestrie (dev + e2e) to GitHub live-signer" >&2
            exit 1
          fi
          echo "live-signer secrets preflight ok"

  live-onboard-secrets-check:
    name: Verify live-onboard secrets present
    runs-on: ubuntu-latest
    environment: live-signer
    steps:
      - name: Fail if required secrets are empty
        env:
          E2E_CANOPY_API_URL: ${{ secrets.E2E_CANOPY_API_URL }}
          E2E_CANOPY_CHAIN_ID: ${{ secrets.E2E_CANOPY_CHAIN_ID }}
          E2E_CANOPY_UNIVOCITY_ADDR: ${{ secrets.E2E_CANOPY_UNIVOCITY_ADDR }}
        run: |
          set -euo pipefail
          missing=0
          check() {
            if [ -z "${1:-}" ]; then
              echo "missing required secret: $2" >&2
              missing=1
            fi
          }
          check "$E2E_CANOPY_API_URL" E2E_CANOPY_API_URL
          check "$E2E_CANOPY_CHAIN_ID" E2E_CANOPY_CHAIN_ID
          check "$E2E_CANOPY_UNIVOCITY_ADDR" E2E_CANOPY_UNIVOCITY_ADDR
          if [ "$missing" -ne 0 ]; then
            echo "Sync Doppler mandate-forestrie (dev + e2e) to GitHub live-signer" >&2
            exit 1
          fi
          echo "live-onboard secrets preflight ok"

  live-onboard:
    name: Self-service onboard request live test (FOR-177)
    runs-on: ubuntu-latest
    environment: live-signer
    needs: live-onboard-secrets-check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run onboard self-service live test
        env:
          E2E_CANOPY_API_URL: ${{ secrets.E2E_CANOPY_API_URL }}
          E2E_CANOPY_CHAIN_ID: ${{ secrets.E2E_CANOPY_CHAIN_ID }}
          E2E_CANOPY_UNIVOCITY_ADDR: ${{ secrets.E2E_CANOPY_UNIVOCITY_ADDR }}
          E2E_CANOPY_OPS_ADMIN_TOKEN: ${{ secrets.E2E_CANOPY_OPS_ADMIN_TOKEN }}
        run: pnpm --filter @mandate/register test:live:onboard

  live-owned:
    name: Privy owned-wallet live test
    runs-on: ubuntu-latest
    environment: live-signer
    needs: live-secrets-check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run owned-wallet live test
        env:
          MANDATE_PRIVY_APP_ID: ${{ secrets.MANDATE_PRIVY_APP_ID }}
          MANDATE_PRIVY_APP_SECRET: ${{ secrets.MANDATE_PRIVY_APP_SECRET }}
          MANDATE_PRIVY_API_BASE: ${{ secrets.MANDATE_PRIVY_API_BASE }}
          MANDATE_PRIVY_SIGNER_ID: ${{ secrets.MANDATE_PRIVY_SIGNER_ID }}
          E2E_SIGNER_TEST_PRIVY_WALLET_ID: ${{ secrets.E2E_SIGNER_TEST_PRIVY_WALLET_ID }}
          MANDATE_PRIVY_AUTHORIZATION_KEY: ${{ secrets.MANDATE_PRIVY_AUTHORIZATION_KEY }}
          E2E_SIGNER_TEST_WALLET_ADDRESS: ${{ secrets.E2E_SIGNER_TEST_WALLET_ADDRESS }}
        run: pnpm --filter @mandate/signer test:live:owned

  live-hands-off:
    name: Agent hands-off sealing live test
    runs-on: ubuntu-latest
    environment: live-signer
    needs: [live-secrets-check, live-owned]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run agent hands-off live test
        env:
          MANDATE_PRIVY_APP_ID: ${{ secrets.MANDATE_PRIVY_APP_ID }}
          MANDATE_PRIVY_APP_SECRET: ${{ secrets.MANDATE_PRIVY_APP_SECRET }}
          MANDATE_PRIVY_API_BASE: ${{ secrets.MANDATE_PRIVY_API_BASE }}
          E2E_SIGNER_TEST_PRIVY_WALLET_ID: ${{ secrets.E2E_SIGNER_TEST_PRIVY_WALLET_ID }}
          MANDATE_PRIVY_AUTHORIZATION_KEY: ${{ secrets.MANDATE_PRIVY_AUTHORIZATION_KEY }}
          E2E_SIGNER_TEST_WALLET_ADDRESS: ${{ secrets.E2E_SIGNER_TEST_WALLET_ADDRESS }}
          E2E_MODE_C_USER_PRIVY_WALLET_ID: ${{ secrets.E2E_MODE_C_USER_PRIVY_WALLET_ID }}
          E2E_MODE_C_PRIVY_OWNER_AUTH_KEY: ${{ secrets.E2E_MODE_C_PRIVY_OWNER_AUTH_KEY }}
          MANDATE_PRIVY_SIGNER_ID: ${{ secrets.MANDATE_PRIVY_SIGNER_ID }}
          E2E_MODE_C_PRIVY_POLICY_ID: ${{ secrets.E2E_MODE_C_PRIVY_POLICY_ID }}
          MANDATE_SIGNER_URL: ${{ secrets.MANDATE_SIGNER_URL }}
        run: pnpm --filter @mandate/agent test:live:hands-off

  live-mode-c:
    name: Mode C onboarding + revoke live test
    runs-on: ubuntu-latest
    environment: live-signer
    needs: [live-secrets-check, live-owned, live-provision]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run Mode C onboarding live test
        env:
          MANDATE_PRIVY_APP_ID: ${{ secrets.MANDATE_PRIVY_APP_ID }}
          MANDATE_PRIVY_APP_SECRET: ${{ secrets.MANDATE_PRIVY_APP_SECRET }}
          MANDATE_PRIVY_API_BASE: ${{ secrets.MANDATE_PRIVY_API_BASE }}
          MANDATE_PRIVY_AUTHORIZATION_KEY: ${{ secrets.MANDATE_PRIVY_AUTHORIZATION_KEY }}
          E2E_MODE_C_USER_PRIVY_WALLET_ID: ${{ secrets.E2E_MODE_C_USER_PRIVY_WALLET_ID }}
          MANDATE_PRIVY_SIGNER_ID: ${{ secrets.MANDATE_PRIVY_SIGNER_ID }}
          E2E_MODE_C_PRIVY_OWNER_AUTH_KEY: ${{ secrets.E2E_MODE_C_PRIVY_OWNER_AUTH_KEY }}
          E2E_MODE_C_PRIVY_POLICY_ID: ${{ secrets.E2E_MODE_C_PRIVY_POLICY_ID }}
          MANDATE_SIGNER_URL: ${{ secrets.MANDATE_SIGNER_URL }}
        run: pnpm --filter @mandate/privy-admin test:live

  live-provision:
    name: Provision + hands-off seal live e2e (FOR-101)
    runs-on: ubuntu-latest
    environment: live-signer
    needs: [live-secrets-check, live-owned]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run provision live e2e
        env:
          E2E_CANOPY_API_URL: ${{ secrets.E2E_CANOPY_API_URL }}
          E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN: ${{ secrets.E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN }}
          E2E_CANOPY_OPS_ADMIN_TOKEN: ${{ secrets.E2E_CANOPY_OPS_ADMIN_TOKEN }}
          E2E_CANOPY_UNIVOCITY_ADDR: ${{ secrets.E2E_CANOPY_UNIVOCITY_ADDR }}
          E2E_CANOPY_CHAIN_ID: ${{ secrets.E2E_CANOPY_CHAIN_ID }}
          E2E_DELEGATION_COORDINATOR_URL: ${{ secrets.E2E_DELEGATION_COORDINATOR_URL }}
          E2E_MANDATE_AGENT_WEBHOOK_URL: ${{ secrets.E2E_MANDATE_AGENT_WEBHOOK_URL }}
          MANDATE_PRIVY_APP_ID: ${{ secrets.MANDATE_PRIVY_APP_ID }}
          MANDATE_PRIVY_APP_SECRET: ${{ secrets.MANDATE_PRIVY_APP_SECRET }}
          MANDATE_PRIVY_API_BASE: ${{ secrets.MANDATE_PRIVY_API_BASE }}
          E2E_MODE_C_USER_PRIVY_WALLET_ID: ${{ secrets.E2E_MODE_C_USER_PRIVY_WALLET_ID }}
          MANDATE_PRIVY_AUTHORIZATION_KEY: ${{ secrets.MANDATE_PRIVY_AUTHORIZATION_KEY }}
          MANDATE_PRIVY_SIGNER_ID: ${{ secrets.MANDATE_PRIVY_SIGNER_ID }}
          E2E_MODE_C_PRIVY_OWNER_AUTH_KEY: ${{ secrets.E2E_MODE_C_PRIVY_OWNER_AUTH_KEY }}
          MANDATE_SIGNER_URL: ${{ secrets.MANDATE_SIGNER_URL }}
          E2E_MODE_C_PRIVY_POLICY_ID: ${{ secrets.E2E_MODE_C_PRIVY_POLICY_ID }}
        run: pnpm --filter @mandate/register test:live:provision

  live-mode-b-secrets-check:
    name: Verify Mode B live secrets present
    runs-on: ubuntu-latest
    environment: live-signer
    steps:
      - name: Fail if required Mode B secrets are empty
        env:
          E2E_USER_SIGNER_URL: ${{ secrets.E2E_USER_SIGNER_URL }}
          USER_SIGNER_BEARER: ${{ secrets.USER_SIGNER_BEARER }}
          USER_SIGNER_KEYS_JSON: ${{ secrets.USER_SIGNER_KEYS_JSON }}
          E2E_CANOPY_API_URL: ${{ secrets.E2E_CANOPY_API_URL }}
          E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN: ${{ secrets.E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN }}
          E2E_CANOPY_OPS_ADMIN_TOKEN: ${{ secrets.E2E_CANOPY_OPS_ADMIN_TOKEN }}
          E2E_CANOPY_UNIVOCITY_ADDR: ${{ secrets.E2E_CANOPY_UNIVOCITY_ADDR }}
          E2E_CANOPY_CHAIN_ID: ${{ secrets.E2E_CANOPY_CHAIN_ID }}
          E2E_DELEGATION_COORDINATOR_URL: ${{ secrets.E2E_DELEGATION_COORDINATOR_URL }}
          E2E_MANDATE_AGENT_WEBHOOK_URL: ${{ secrets.E2E_MANDATE_AGENT_WEBHOOK_URL }}
          MANDATE_SIGNER_URL: ${{ secrets.MANDATE_SIGNER_URL }}
        run: |
          set -euo pipefail
          missing=0
          check() {
            if [ -z "${1:-}" ]; then
              echo "missing required secret: $2" >&2
              missing=1
            fi
          }
          check "$E2E_USER_SIGNER_URL" E2E_USER_SIGNER_URL
          check "$USER_SIGNER_BEARER" USER_SIGNER_BEARER
          check "$USER_SIGNER_KEYS_JSON" USER_SIGNER_KEYS_JSON
          check "$E2E_CANOPY_API_URL" E2E_CANOPY_API_URL
          check "$E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN" E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN
          check "$E2E_CANOPY_OPS_ADMIN_TOKEN" E2E_CANOPY_OPS_ADMIN_TOKEN
          check "$E2E_CANOPY_UNIVOCITY_ADDR" E2E_CANOPY_UNIVOCITY_ADDR
          check "$E2E_CANOPY_CHAIN_ID" E2E_CANOPY_CHAIN_ID
          check "$E2E_DELEGATION_COORDINATOR_URL" E2E_DELEGATION_COORDINATOR_URL
          check "$E2E_MANDATE_AGENT_WEBHOOK_URL" E2E_MANDATE_AGENT_WEBHOOK_URL
          check "$MANDATE_SIGNER_URL" MANDATE_SIGNER_URL
          if [ "$missing" -ne 0 ]; then
            echo "Sync Doppler mandate-forestrie (dev + e2e) to GitHub live-signer" >&2
            exit 1
          fi
          echo "live-mode-b secrets preflight ok"

  live-mode-b:
    name: Mode B reference user signer live test
    runs-on: ubuntu-latest
    environment: live-signer
    needs: live-mode-b-secrets-check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run Mode B live sealing test
        env:
          LIVE_MODE_B: '1'
          E2E_USER_SIGNER_URL: ${{ secrets.E2E_USER_SIGNER_URL }}
          USER_SIGNER_BEARER: ${{ secrets.USER_SIGNER_BEARER }}
          USER_SIGNER_KEYS_JSON: ${{ secrets.USER_SIGNER_KEYS_JSON }}
          E2E_CANOPY_API_URL: ${{ secrets.E2E_CANOPY_API_URL }}
          E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN: ${{ secrets.E2E_CANOPY_PAYMENTS_ONBOARD_TOKEN }}
          E2E_CANOPY_OPS_ADMIN_TOKEN: ${{ secrets.E2E_CANOPY_OPS_ADMIN_TOKEN }}
          E2E_CANOPY_UNIVOCITY_ADDR: ${{ secrets.E2E_CANOPY_UNIVOCITY_ADDR }}
          E2E_CANOPY_CHAIN_ID: ${{ secrets.E2E_CANOPY_CHAIN_ID }}
          E2E_DELEGATION_COORDINATOR_URL: ${{ secrets.E2E_DELEGATION_COORDINATOR_URL }}
          E2E_MANDATE_AGENT_WEBHOOK_URL: ${{ secrets.E2E_MANDATE_AGENT_WEBHOOK_URL }}
          MANDATE_SIGNER_URL: ${{ secrets.MANDATE_SIGNER_URL }}
        run: pnpm --filter @mandate/agent test:live:mode-b
