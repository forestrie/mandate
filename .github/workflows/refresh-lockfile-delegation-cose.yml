name: Refresh delegation-cose lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - robin/for-119-packages-install

permissions:
  contents: write
  packages: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://npm.pkg.github.com
          scope: "@forestrie"
          cache: pnpm

      - name: Update lockfile
        run: pnpm update @forestrie/delegation-cose@0.1.1 --recursive
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit lockfile
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(deps): lockfile for delegation-cose 0.1.1"
          file_pattern: pnpm-lock.yaml
