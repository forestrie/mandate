name: Deploy Workers production

on:
  push:
    branches: [main]

concurrency:
  group: workers-prod
  cancel-in-progress: true

jobs:
  deploy-workers:
    name: Deploy mandate-agent and mandate-signer
    if: vars.ENABLE_WORKERS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      deployments: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Init Workers infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_PRIVY_APP_ID: ${{ vars.PUBLIC_PRIVY_APP_ID }}
          CICD: 'true'
        run: task -t Taskfile.dist.yml repo-init

      - name: Deploy mandate-agent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: packages/apps/agent
        run: pnpm exec wrangler deploy --env prod --config ../../../.wrangler/deploy/agent.wrangler.jsonc

      - name: Bind mandate-agent secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COORDINATOR_APP_TOKEN: ${{ secrets.COORDINATOR_APP_TOKEN }}
          MANDATE_SIGNER_TOKEN: ${{ secrets.MANDATE_SIGNER_TOKEN }}
          OPERATOR_ROOT_KEYS: ${{ secrets.OPERATOR_ROOT_KEYS }}
        working-directory: packages/apps/agent
        run: |
          printf '%s' "$COORDINATOR_APP_TOKEN" | pnpm exec wrangler secret put COORDINATOR_APP_TOKEN --env prod --config ../../../.wrangler/deploy/agent.wrangler.jsonc
          printf '%s' "$MANDATE_SIGNER_TOKEN" | pnpm exec wrangler secret put MANDATE_SIGNER_TOKEN --env prod --config ../../../.wrangler/deploy/agent.wrangler.jsonc
          printf '%s' "$OPERATOR_ROOT_KEYS" | pnpm exec wrangler secret put OPERATOR_ROOT_KEYS --env prod --config ../../../.wrangler/deploy/agent.wrangler.jsonc

      - name: Deploy mandate-signer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: packages/apps/signer
        run: pnpm exec wrangler deploy --env prod --config ../../../.wrangler/deploy/signer.wrangler.jsonc

      - name: Bind mandate-signer secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MANDATE_SIGNER_TOKEN: ${{ secrets.MANDATE_SIGNER_TOKEN }}
          PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
          KEY_DIRECTORY: ${{ secrets.KEY_DIRECTORY }}
          PRIVY_AUTHORIZATION_KEY: ${{ secrets.PRIVY_AUTHORIZATION_KEY }}
        working-directory: packages/apps/signer
        run: |
          printf '%s' "$MANDATE_SIGNER_TOKEN" | pnpm exec wrangler secret put MANDATE_SIGNER_TOKEN --env prod --config ../../../.wrangler/deploy/signer.wrangler.jsonc
          printf '%s' "$PRIVY_APP_SECRET" | pnpm exec wrangler secret put PRIVY_APP_SECRET --env prod --config ../../../.wrangler/deploy/signer.wrangler.jsonc
          printf '%s' "$KEY_DIRECTORY" | pnpm exec wrangler secret put KEY_DIRECTORY --env prod --config ../../../.wrangler/deploy/signer.wrangler.jsonc
          if [ -n "$PRIVY_AUTHORIZATION_KEY" ]; then
            printf '%s' "$PRIVY_AUTHORIZATION_KEY" | pnpm exec wrangler secret put PRIVY_AUTHORIZATION_KEY --env prod --config ../../../.wrangler/deploy/signer.wrangler.jsonc
          fi
