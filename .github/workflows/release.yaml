name: Release

# Tag push: hermetic gate. Orchestrator dispatch (ADR-0043 / FOR-272): unit
# tests from main, capture release fragment, patch-bump semver tag + GitHub
# Release with compound components.jsonc.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      orchestrator_run_id:
        description: Correlation id from release-orchestrator release.yml
        required: true
        type: string
      skip_cross_repo_tests:
        description: Skip cross-repo tests when orchestrator already qualified dev
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        env:
          PUBLIC_COORDINATOR_BFF_BASE: /api/coordinator
          PUBLIC_MANDATE_PRIVY_APP_ID: ci-placeholder
          PUBLIC_MANDATE_PRIVY_CLIENT_ID: ci-placeholder
          PUBLIC_DEFAULT_CHAIN_ID: '84532'
        run: pnpm check

      - name: Install Playwright Chromium (ui-e2e-kit tests)
        run: pnpm --filter @forestrie/mandate-ui-e2e-kit exec playwright install chromium --with-deps

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          CF_PAGES: '1'
          PUBLIC_COORDINATOR_BFF_BASE: /api/coordinator
          PUBLIC_MANDATE_PRIVY_APP_ID: ci-placeholder
          PUBLIC_MANDATE_PRIVY_CLIENT_ID: ci-placeholder
          PUBLIC_DEFAULT_CHAIN_ID: '84532'
        run: pnpm build:ui

  capture-release-fragment:
    # secret-egress-ok: exports only `release_tag`, a public version tag
    # It is read from the releases API; secrets.GITHUB_TOKEN authenticates that
    # query and never reaches an output. See devdocs plan-2608-04.
    name: Capture release fragment
    needs: unit-tests
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            latest=$(gh release list --repo "${{ github.repository }}" --limit 50 \
              --json tagName \
              -q '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+"))][0].tagName // empty')
            if [ -z "$latest" ]; then
              tag="v0.1.0"
            else
              base="${latest#v}"
              IFS=. read -r major minor patch <<< "${base%%-*}"
              patch=$((patch + 1))
              tag="v${major}.${minor}.${patch}"
            fi
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Write release fragment
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
          ORCH_RUN_ID: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            github.event.inputs.orchestrator_run_id || github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg tag "$TAG" \
            --arg sha "$SHA" \
            --arg ref "${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}" \
            --arg orchestratorRunId "$ORCH_RUN_ID" \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion: 3,
              repo: $repo,
              ref: $ref,
              tag: $tag,
              sha: $sha,
              orchestratorRunId: $orchestratorRunId,
              capturedAt: $capturedAt,
              services: {
                mandate: { repo: "forestrie/mandate", ref: $sha }
              }
            }' > release-metadata/release-fragment.jsonc
          cat release-metadata/release-fragment.jsonc

      - name: Upload release fragment
        uses: actions/upload-artifact@v4
        with:
          name: release-fragment
          path: release-metadata/release-fragment.jsonc
          retention-days: 90
          if-no-files-found: error

  # FOR-532. This job used to be gated to `workflow_dispatch`. The frontier
  # resolver reads GitHub *Releases*, not git tags: `fetchLatestReleaseTag` and
  # `fetchSemverReleaseTags` both call `GET /repos/{owner}/{repo}/releases` and
  # match `tag_name`, and the kit pins come from the `components.jsonc` release
  # ASSET (release-orchestrator/packages/resolver/src/github-releases.ts). So
  # once auto-tag started cutting tags on merge (plan 2608-06 Phase 2) the tag
  # appeared, this workflow ran, and the frontier never advanced — no Release,
  # no components.jsonc, nothing for qualification to resolve. v0.1.16 was the
  # first mandate tag to land in that hole.
  #
  # It now runs on BOTH paths. The dispatch path is unchanged in behaviour and
  # goes away with plan 2608-06 Phase 3d.
  publish-github-release:
    name: Publish GitHub Release
    needs: capture-release-fragment
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Dispatch cuts a new tag from main. A tag push must describe the TAGGED
      # tree — main may have moved on, and components.jsonc is read out of this
      # checkout, so taking main here would pin kit versions that are not the
      # ones this release contains.
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' && 'main'
            || github.ref_name }}
          fetch-depth: 0

      # Only the dispatch path mints a tag. On the tag-push path auto-tag
      # already did, and two cutters on one namespace is its own defect.
      - name: Create annotated tag (orchestrator dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.capture-release-fragment.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping tag create"
          else
            git tag -a "$TAG" -m "Orchestrator release $TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release with components.jsonc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.capture-release-fragment.outputs.release_tag }}
          ORCH_RUN_ID: ${{ github.event.inputs.orchestrator_run_id }}
        run: |
          set -euo pipefail
          : "${TAG:?capture-release-fragment produced no release_tag}"
          UI_KIT_VERSION=$(node -p "require('./packages/tests/ui-e2e-kit/package.json').version")
          REGISTER_VERSION=$(node -p "require('./packages/publish/mandate-register/package.json').version")
          jq -n \
            --arg ecosystem "pnpm" \
            --arg ui "@forestrie/mandate-ui-e2e-kit" \
            --arg uiVer "$UI_KIT_VERSION" \
            --arg reg "@forestrie/mandate-register" \
            --arg regVer "$REGISTER_VERSION" \
            '{ ecosystem: $ecosystem, components: { ($ui): $uiVer, ($reg): $regVer } }' \
            > components.jsonc
          cat components.jsonc
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            notes="Orchestrator-driven release (run ${ORCH_RUN_ID})."
          else
            notes="Released from tag ${TAG}, cut by auto-tag on merge to main."
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" components.jsonc --clobber
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "$notes" \
              components.jsonc
          fi
          # The assertion that catches the silence: read it back the way the
          # resolver will, rather than trusting the create. A Release that is
          # not listed, or is listed without its kit pins, is invisible to
          # qualification in exactly the way FOR-532 describes.
          #
          # POLL, don't check once. The /releases LIST endpoint is eventually
          # consistent: on the first live run of this job it returned 0 matches
          # roughly half a second after `gh release create` had printed the
          # release URL, so a single check failed a release that was in fact
          # published.
          found=0
          for attempt in 1 2 3 4 5 6; do
            got=$(gh api "/repos/${{ github.repository }}/releases?per_page=100" \
                    --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
            if [ "$got" = "1" ]; then
              found=1
              echo "verified on attempt ${attempt}: ${TAG} is listed by /releases"
              break
            fi
            echo "attempt ${attempt}: ${TAG} not yet listed by /releases (found ${got}); retrying"
            sleep 5
          done
          if [ "$found" != "1" ]; then
            echo "::error::Release ${TAG} never appeared in /releases after ~30s — the frontier resolver would not see this release" >&2
            exit 1
          fi
          if ! gh release view "$TAG" --repo "${{ github.repository }}" \
                 --json assets --jq '.assets[].name' | grep -qx 'components.jsonc'; then
            echo "::error::Release ${TAG} carries no components.jsonc asset — kit pins would be unresolvable" >&2
            exit 1
          fi
          echo "verified: ${TAG} is listed by /releases and carries components.jsonc"
