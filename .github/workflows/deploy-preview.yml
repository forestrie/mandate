name: Deploy preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (fork PR)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          CF_PAGES: '1'
          PUBLIC_COORDINATOR_BFF_BASE: /api/coordinator
          PUBLIC_MANDATE_PRIVY_APP_ID: ci-placeholder
          PUBLIC_MANDATE_PRIVY_CLIENT_ID: ci-placeholder
          PUBLIC_DEFAULT_CHAIN_ID: '84532'
        run: pnpm build:ui

  deploy-preview:
    name: Deploy Pages preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.ENABLE_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          CF_PAGES: '1'
          PUBLIC_COORDINATOR_BFF_BASE: /api/coordinator
          PUBLIC_MANDATE_PRIVY_APP_ID: ${{ vars.PUBLIC_MANDATE_PRIVY_APP_ID }}
          PUBLIC_MANDATE_PRIVY_CLIENT_ID: ${{ vars.PUBLIC_MANDATE_PRIVY_CLIENT_ID }}
          PUBLIC_DEFAULT_CHAIN_ID: ${{ vars.PUBLIC_DEFAULT_CHAIN_ID }}
        run: pnpm build:ui

      - name: Deploy preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy packages/apps/ui/.svelte-kit/cloudflare \
            --project-name=mandate-dev \
            --branch="${{ github.head_ref }}"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const body = `Cloudflare Pages preview deployed for branch \`${branch}\`. Check the deployment in the Cloudflare dashboard for the preview URL.`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
