# PR gate for the secret-egress class (devdocs plan-2608-04): no job may export
# secret-derived data through `outputs:`. GitHub drops such outputs silently,
# so the consumer receives an empty string and the failure surfaces far from its
# cause — the shape that had canopy's T3 tier broken from the day it was built.
#
# Jobs triaged benign during the 2026-08-02 estate sweep carry
# `# secret-egress-ok: <reason>` in place; the reason is echoed in the report.
name: Workflow lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-egress:
    name: Secret egress lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: forestrie/.github/actions/secret-egress-lint@main

  # `.github/auto-tag-packages.json` is what the auto-tag workflow reads on
  # every merge to decide which packages to tag, so a package missing from it
  # is a package that never publishes — silently. Offline; no npm half here
  # (plan 2608-05 Q3 keeps the recurring repo-vs-npm check in the frontier
  # resolver). Run `scripts/check-published-packages.sh npm` by hand.
  published-packages:
    name: Declared packages match the publish workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: bash scripts/check-published-packages.sh config
