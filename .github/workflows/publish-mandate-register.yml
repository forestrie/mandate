name: Publish mandate-register

on:
  workflow_dispatch:
  push:
    tags:
      - 'mandate-register-v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish @forestrie/mandate-register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test bundle
        run: pnpm --filter @forestrie/mandate-register test

      - name: Build bundle
        run: pnpm --filter @forestrie/mandate-register build

      # Publish auth only: publishConfig.registry targets GitHub Packages;
      # installs resolve @forestrie from public npmjs (FOR-336).
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"
          pnpm --filter @forestrie/mandate-register publish --no-git-checks

      - name: Attach components.jsonc to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/publish/mandate-register/package.json').version")
          jq -n \
            --arg ecosystem "pnpm" \
            --arg pkg "@forestrie/mandate-register" \
            --arg ver "$VERSION" \
            '{ ecosystem: $ecosystem, components: { ($pkg): $ver } }' \
            > components.jsonc
          if gh release view "$GIT_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$GIT_TAG" components.jsonc --repo "${{ github.repository }}" --clobber
          else
            gh release create "$GIT_TAG" \
              --repo "${{ github.repository }}" \
              --title "$GIT_TAG" \
              --notes "Compound kit release for @forestrie/mandate-register@${VERSION}." \
              components.jsonc
          fi
