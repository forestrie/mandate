name: Refresh delegation-cose lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://npm.pkg.github.com
          scope: '@forestrie'
          cache: pnpm

      - name: Mint GitHub Packages token
        id: packages-token
        uses: ./.github/actions/github-packages-token
        with:
          app_id: ${{ vars.GITAPP_ID }}
          private_key: ${{ secrets.GITAPP_PRIVATE_KEY }}

      - name: Update lockfile
        run: pnpm update @forestrie/delegation-cose@0.1.1 --recursive
        env:
          NODE_AUTH_TOKEN: ${{ steps.packages-token.outputs.token }}

      - name: Commit lockfile
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(deps): lockfile for delegation-cose 0.1.1'
          file_pattern: pnpm-lock.yaml
