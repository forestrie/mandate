name: Refresh delegation-cose lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://npm.pkg.github.com
          scope: '@forestrie'
          cache: pnpm

      - name: Mint GitHub Packages token
        id: packages-token
        uses: ./.github/actions/github-packages-token
        with:
          app_id: ${{ vars.GITAPP_ID }}
          private_key: ${{ secrets.GITAPP_PRIVATE_KEY }}

      - name: Update lockfile and package pins
        run: |
          for pkg in packages/apps/agent packages/apps/ui packages/apps/reference-user-signer; do
            node -e "
              const fs = require('fs');
              const path = '$pkg/package.json';
              const j = JSON.parse(fs.readFileSync(path, 'utf8'));
              const dep = j.dependencies || j.devDependencies;
              if (dep && dep['@forestrie/delegation-cose']) {
                dep['@forestrie/delegation-cose'] = '0.1.1';
                fs.writeFileSync(path, JSON.stringify(j, null, '\t') + '\n');
              }
            "
          done
          pnpm update @forestrie/delegation-cose@0.1.1 --recursive
        env:
          NODE_AUTH_TOKEN: ${{ steps.packages-token.outputs.token }}

      - name: Commit lockfile and semver pins
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(deps): semver pin delegation-cose 0.1.1'
          file_pattern: pnpm-lock.yaml packages/apps/*/package.json
