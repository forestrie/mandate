name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # FOR-366 (plan-2607-13 W5/M1): every registry-installed @forestrie
      # dependency must resolve from registry.npmjs.org and carry a SLSA
      # provenance attestation whose identity is the expected forestrie
      # publish workflow. Replacement control for the deleted FOR-119
      # exact-pin refresh mechanism.
      - name: Verify @forestrie dependency provenance
        run: |
          pnpm test:scripts
          pnpm verify:provenance

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        env:
          PUBLIC_COORDINATOR_BFF_BASE: /api/coordinator
          PUBLIC_MANDATE_PRIVY_APP_ID: ci-placeholder
          PUBLIC_MANDATE_PRIVY_CLIENT_ID: ci-placeholder
          PUBLIC_DEFAULT_CHAIN_ID: '84532'
        run: pnpm check

      - name: Install Playwright Chromium (ui-e2e-kit tests)
        run: pnpm --filter @forestrie/mandate-ui-e2e-kit exec playwright install chromium --with-deps

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          CF_PAGES: '1'
          PUBLIC_COORDINATOR_BFF_BASE: /api/coordinator
          PUBLIC_MANDATE_PRIVY_APP_ID: ci-placeholder
          PUBLIC_MANDATE_PRIVY_CLIENT_ID: ci-placeholder
          PUBLIC_DEFAULT_CHAIN_ID: '84532'
        run: pnpm build:ui

      - name: Audit client bundle for secret names
        run: pnpm audit:client-secrets
