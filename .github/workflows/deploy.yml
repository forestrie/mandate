name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: pages-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Pages production
    if: vars.ENABLE_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The /onboard inline deploy branch defaults to the NEWEST univocity
      # release, resolved here to a concrete tag (plan-2607-47; a `latest`
      # sentinel would put an anonymous GitHub lookup on the page path —
      # the deploy-web 403 class).
      - name: Resolve univocity release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/forestrie/univocity/releases/latest --jq .tag_name)
          test -n "$TAG"
          echo "PUBLIC_UNIVOCITY_RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Default univocity release tag: $TAG"

      - name: Build
        env:
          CF_PAGES: '1'
          PUBLIC_COORDINATOR_BFF_BASE: /api/coordinator
          PUBLIC_MANDATE_PRIVY_APP_ID: ${{ vars.PUBLIC_MANDATE_PRIVY_APP_ID }}
          PUBLIC_MANDATE_PRIVY_CLIENT_ID: ${{ vars.PUBLIC_MANDATE_PRIVY_CLIENT_ID }}
          PUBLIC_DEFAULT_CHAIN_ID: ${{ vars.PUBLIC_DEFAULT_CHAIN_ID }}
          # Canopy base for the browser-direct fee surface (FOR-485); the
          # attestation aud is this URL's origin.
          PUBLIC_CANOPY_API_URL: ${{ vars.PUBLIC_CANOPY_API_URL }}
          # Browser-side RPC for Mode D Safe validation (plan-2607-45 slice 03);
          # keyless endpoint for PUBLIC_DEFAULT_CHAIN_ID.
          PUBLIC_RPC_URL: ${{ vars.PUBLIC_RPC_URL || 'https://sepolia.base.org' }}
        run: pnpm build:ui

      - name: Bind Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: packages/apps/ui
        # Runtime env for the Pages Functions BFF: coordinator proxy plus the
        # operator personality trio (FOR-493) — all three operator vars must
        # be present or /instances answers 501 by design. Bind BEFORE deploy:
        # Pages secrets apply to deployments created after binding, so the
        # reverse order leaves a fresh project's first deployment without them
        # (bootstrap finding, 2026-07-28).
        run: |
          echo "${{ secrets.COORDINATOR_APP_TOKEN }}" | pnpm exec wrangler pages secret put COORDINATOR_APP_TOKEN --project-name=mandate-prod
          echo "${{ secrets.COORDINATOR_UPSTREAM_URL }}" | pnpm exec wrangler pages secret put COORDINATOR_UPSTREAM_URL --project-name=mandate-prod
          echo "${{ secrets.MANDATE_OPS_UI_TOKEN }}" | pnpm exec wrangler pages secret put MANDATE_OPS_UI_TOKEN --project-name=mandate-prod
          echo "${{ secrets.CANOPY_UPSTREAM_URL }}" | pnpm exec wrangler pages secret put CANOPY_UPSTREAM_URL --project-name=mandate-prod
          echo "${{ secrets.MANDATE_CANOPY_OPS_TOKEN }}" | pnpm exec wrangler pages secret put MANDATE_CANOPY_OPS_TOKEN --project-name=mandate-prod
          # PUBLIC_* config read via $env/dynamic/public resolves from the
          # runtime Pages env, not the build env — the ssr=false shells for
          # /fees and /onboard are served by the worker, which injects
          # `env: {}` unless these are bound to the project. Public values,
          # but `secret put` is wrangler's only scriptable Pages env write.
          echo "${{ vars.PUBLIC_CANOPY_API_URL }}" | pnpm exec wrangler pages secret put PUBLIC_CANOPY_API_URL --project-name=mandate-prod
          echo "${{ vars.PUBLIC_RPC_URL || 'https://sepolia.base.org' }}" | pnpm exec wrangler pages secret put PUBLIC_RPC_URL --project-name=mandate-prod
          echo "$PUBLIC_UNIVOCITY_RELEASE_TAG" | pnpm exec wrangler pages secret put PUBLIC_UNIVOCITY_RELEASE_TAG --project-name=mandate-prod
          # OPTIONAL GitHub token for the /api/deploy/manifest byte proxy
          # (plan-2607-47 Q7a). Unset ⇒ the proxy uses the public release
          # download URL, which is CDN-served and not API-rate-limited.
          if [ -n "${{ secrets.MANDATE_GITHUB_TOKEN }}" ]; then
            echo "${{ secrets.MANDATE_GITHUB_TOKEN }}" | pnpm exec wrangler pages secret put MANDATE_GITHUB_TOKEN --project-name=mandate-prod
          fi
          # BFF auth strategy. Unbound it defaults to app_token_bff, which
          # swaps the browser's wallet-challenge session bearer for the app
          # token — the coordinator then 401s every session-scoped call
          # (signing-route, /delegations) on wallet-challenge deployments.
          echo "wallet_challenge" | pnpm exec wrangler pages secret put COORDINATOR_AUTH_MODE --project-name=mandate-prod

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy packages/apps/ui/.svelte-kit/cloudflare \
            --project-name=mandate-prod \
            --branch=main
