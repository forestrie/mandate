name: Publish mandate-ui-e2e-kit

on:
  workflow_dispatch:
  push:
    tags:
      - 'mandate-ui-e2e-kit-v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish @forestrie/mandate-ui-e2e-kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://npm.pkg.github.com
          scope: '@forestrie'
          cache: pnpm

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium (kit tests)
        run: pnpm --filter @forestrie/mandate-ui-e2e-kit exec playwright install chromium --with-deps

      - name: Test kit
        run: pnpm --filter @forestrie/mandate-ui-e2e-kit test

      - name: Build kit
        run: pnpm --filter @forestrie/mandate-ui-e2e-kit build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @forestrie/mandate-ui-e2e-kit publish --no-git-checks

      - name: Attach components.jsonc to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/tests/ui-e2e-kit/package.json').version")
          jq -n \
            --arg ecosystem "pnpm" \
            --arg pkg "@forestrie/mandate-ui-e2e-kit" \
            --arg ver "$VERSION" \
            '{ ecosystem: $ecosystem, components: { ($pkg): $ver } }' \
            > components.jsonc
          if gh release view "$GIT_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$GIT_TAG" components.jsonc --repo "${{ github.repository }}" --clobber
          else
            gh release create "$GIT_TAG" \
              --repo "${{ github.repository }}" \
              --title "$GIT_TAG" \
              --notes "Compound kit release for @forestrie/mandate-ui-e2e-kit@${VERSION}." \
              components.jsonc
          fi
