name: GitHub Packages token
description: >-
  Mint a forestrie org GitHub App installation token for cross-repo
  npm.pkg.github.com reads (@forestrie/delegation-cose from canopy).

inputs:
  app_id:
    description: GitHub App ID (repo or environment variable GITAPP_ID)
    required: false
    default: ''
  private_key:
    description: GitHub App private key PEM
    required: false
    default: ''

outputs:
  token:
    description: Value for NODE_AUTH_TOKEN
    value: ${{ steps.resolve.outputs.token }}

runs:
  using: composite
  steps:
    - name: Mint GitHub App token
      id: app-token
      if: inputs.app_id != ''
      uses: tibdex/github-app-token@v1
      with:
        app_id: ${{ inputs.app_id }}
        private_key: ${{ inputs.private_key }}

    - name: Resolve NODE_AUTH_TOKEN
      id: resolve
      shell: bash
      run: |
        if [ -n "${{ steps.app-token.outputs.token }}" ]; then
          echo "token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
        else
          echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
        fi
