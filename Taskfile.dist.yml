version: '3'

vars:
  DOPPLER_PROJECT: mandate-forestrie
  DOPPLER_CONFIG: dev

tasks:
  repo-init:
    desc: >-
      Provision Cloudflare KV and gitignored wrangler.env.prod.json overlays;
      requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
    env:
      CICD: '{{.CICD | default "false"}}'
    preconditions:
      - sh: test -n "${CLOUDFLARE_API_TOKEN:-}"
        msg: CLOUDFLARE_API_TOKEN must be set
      - sh: test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
        msg: CLOUDFLARE_ACCOUNT_ID must be set
    cmds:
      - node scripts/repo-init.mjs

  repo-init:doppler:
    desc: repo-init with Doppler-injected Cloudflare credentials
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- task repo-init

  dev:
    desc: Run Vite dev server (@mandate/ui)
    cmds:
      - pnpm dev

  dev:doppler:
    desc: Run dev with Doppler-injected secrets
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config dev -- pnpm dev

  build:
    desc: Production build for all workspace packages
    cmds:
      - pnpm build

  build:ui:
    desc: Production build for Cloudflare Pages (@mandate/ui)
    env:
      CF_PAGES: '1'
    cmds:
      - pnpm build:ui

  build:doppler:
    desc: Build ui with Doppler secrets for local Pages preview
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config dev -- pnpm build:ui

  preview:
    desc: Preview built Pages output locally
    cmds:
      - pnpm preview

  test:
    desc: Unit tests
    cmds:
      - pnpm test

  check:
    desc: Typecheck
    cmds:
      - pnpm check

  lint:
    desc: Prettier + ESLint
    cmds:
      - pnpm lint

  sync:coordinator-types:
    desc: Copy coordinator types from sibling canopy checkout
    cmds:
      - pnpm sync:coordinator-types

  privy:onboard:mode-c:
    desc: >-
      Mode C Privy onboarding — attach mandate additional signer + policy;
      requires MANDATE_* (dev) + E2E_* fixture secrets (e2e)
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- doppler run --project {{.DOPPLER_PROJECT}} --config e2e -- pnpm --filter @mandate/register exec mandate-register privy onboard-mode-c {{.CLI_ARGS}}

  privy:revoke:mode-c:
    desc: >-
      Mode C kill switch — remove all additional signers from user-owned wallet;
      requires E2E_MODE_C_PRIVY_OWNER_AUTH_KEY in Doppler e2e config (FOR-114)
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- doppler run --project {{.DOPPLER_PROJECT}} --config e2e -- pnpm --filter @mandate/register exec mandate-register privy revoke-mode-c {{.CLI_ARGS}}

  test:live:owned:
    desc: Owned-wallet signer live test (dev + e2e Doppler; E2E_SIGNER_TEST_*)
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- doppler run --project {{.DOPPLER_PROJECT}} --config e2e -- pnpm --filter @mandate/signer test:live:owned

  test:live:hands-off:
    desc: Agent hands-off sealing live test (dev + e2e Doppler)
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- doppler run --project {{.DOPPLER_PROJECT}} --config e2e -- pnpm --filter @mandate/agent test:live:hands-off

  test:live:mode-c:
    desc: Mode C onboarding + revoke live test (dev + e2e Doppler)
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- doppler run --project {{.DOPPLER_PROJECT}} --config e2e -- pnpm --filter @mandate/privy-admin test:live

  test:live:provision:
    desc: Provision + genesis live e2e (dev + e2e Doppler)
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- doppler run --project {{.DOPPLER_PROJECT}} --config e2e -- pnpm --filter @mandate/register test:live:provision

  test:live:onboard:
    desc: Self-service onboard request → approve → redeem live e2e
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- doppler run --project {{.DOPPLER_PROJECT}} --config e2e -- doppler run --project canopy --config dev -- pnpm --filter @mandate/register test:live:onboard

  onboard:request:
    desc: Submit self-service onboard token request (FOR-173)
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- doppler run --project {{.DOPPLER_PROJECT}} --config e2e -- pnpm --filter @mandate/register exec mandate-register onboard request {{.CLI_ARGS}}

  onboard:redeem:
    desc: Redeem approved onboard request for bearer token (FOR-173)
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- doppler run --project {{.DOPPLER_PROJECT}} --config e2e -- pnpm --filter @mandate/register exec mandate-register onboard redeem {{.CLI_ARGS}}

  onboard:status:
    desc: Poll onboard request status by request id (FOR-173)
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- doppler run --project {{.DOPPLER_PROJECT}} --config e2e -- pnpm --filter @mandate/register exec mandate-register onboard status {{.CLI_ARGS}}

  provision:e2e-signer-test-wallet:
    desc: >-
      Create a fresh user-owned E2E_SIGNER_TEST_* wallet and onboard mandate;
      optional ARCHIVE_WALLET_ID=vbd6kev6... to archive retired wallet
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- npx --yes tsx scripts/provision-e2e-signer-test-wallet.ts

  provision:
    desc: >-
      Provision forest instance via onboard token + genesis ?webhookUrl=;
      emits KEY_DIRECTORY + OPERATOR_ROOT_KEYS (FOR-100); needs dev + e2e
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- doppler run --project {{.DOPPLER_PROJECT}} --config e2e -- pnpm --filter @mandate/register exec mandate-register provision {{.CLI_ARGS}}
