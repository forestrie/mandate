version: '3'

vars:
  DOPPLER_PROJECT: mandate-forestrie
  DOPPLER_CONFIG: dev

tasks:
  repo-init:
    desc: >-
      Provision Cloudflare KV and gitignored wrangler.env.prod.json overlays;
      requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
    env:
      CICD: '{{.CICD | default "false"}}'
    preconditions:
      - sh: test -n "${CLOUDFLARE_API_TOKEN:-}"
        msg: CLOUDFLARE_API_TOKEN must be set
      - sh: test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
        msg: CLOUDFLARE_ACCOUNT_ID must be set
    cmds:
      - node scripts/repo-init.mjs

  repo-init:doppler:
    desc: repo-init with Doppler-injected Cloudflare credentials
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- task repo-init

  dev:
    desc: Run Vite dev server (@mandate/ui)
    cmds:
      - pnpm dev

  dev:doppler:
    desc: Run dev with Doppler-injected secrets
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config dev -- pnpm dev

  build:
    desc: Production build for all workspace packages
    cmds:
      - pnpm build

  build:ui:
    desc: Production build for Cloudflare Pages (@mandate/ui)
    env:
      CF_PAGES: '1'
    cmds:
      - pnpm build:ui

  build:doppler:
    desc: Build ui with Doppler secrets for local Pages preview
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config dev -- pnpm build:ui

  preview:
    desc: Preview built Pages output locally
    cmds:
      - pnpm preview

  test:
    desc: Unit tests
    cmds:
      - pnpm test

  check:
    desc: Typecheck
    cmds:
      - pnpm check

  lint:
    desc: Prettier + ESLint
    cmds:
      - pnpm lint

  sync:coordinator-types:
    desc: Copy coordinator types from sibling canopy checkout
    cmds:
      - pnpm sync:coordinator-types

  privy:onboard:mode-c:
    desc: >-
      Mode C Privy onboarding — attach mandate additional signer + policy;
      requires PRIVY_* and MANDATE_SIGNER_URL in Doppler
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- pnpm --filter @mandate/register exec mandate-register privy onboard-mode-c {{.CLI_ARGS}}

  provision:
    desc: >-
      Provision forest instance via onboard token + genesis ?webhookUrl=;
      emits KEY_DIRECTORY + OPERATOR_ROOT_KEYS (FOR-100)
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config {{.DOPPLER_CONFIG}} -- pnpm --filter @mandate/register exec mandate-register provision {{.CLI_ARGS}}
