version: '3'

vars:
  DOPPLER_PROJECT: mandate

tasks:
  dev:
    desc: Run Vite dev server (@mandate/ui)
    cmds:
      - pnpm dev

  dev:doppler:
    desc: Run dev with Doppler-injected secrets
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config dev -- pnpm dev

  build:
    desc: Production build for all workspace packages
    cmds:
      - pnpm build

  build:ui:
    desc: Production build for Cloudflare Pages (@mandate/ui)
    env:
      CF_PAGES: '1'
    cmds:
      - pnpm build:ui

  build:doppler:
    desc: Build ui with Doppler secrets for local Pages preview
    cmds:
      - doppler run --project {{.DOPPLER_PROJECT}} --config dev -- pnpm build:ui

  preview:
    desc: Preview built Pages output locally
    cmds:
      - pnpm preview

  test:
    desc: Unit tests
    cmds:
      - pnpm test

  check:
    desc: Typecheck
    cmds:
      - pnpm check

  lint:
    desc: Prettier + ESLint
    cmds:
      - pnpm lint

  sync:coordinator-types:
    desc: Copy coordinator types from sibling canopy checkout
    cmds:
      - pnpm sync:coordinator-types
